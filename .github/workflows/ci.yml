# Checks only: analyze, test and build. Publishes nothing;
# releases are created by hand from the local release folder.
#
# The native macOS integration test protects the complete registration,
# vault and UI flow. Other release builds stay in release-build.yml.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running check of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  dart:
    name: Core and server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve package language versions
        run: |
          (cd packages/sixora_core && dart pub get)
          (cd server && dart pub get)
          (cd browser && dart pub get)
          (cd app && flutter pub get)
      - name: Formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/sixora_core/lib packages/sixora_core/test
          server/lib server/bin server/test
          browser/lib browser/test browser/tool
          app/lib app/test app/integration_test
      - name: Core
        working-directory: packages/sixora_core
        run: dart analyze --fatal-infos && dart test
      - name: Server
        working-directory: server
        run: dart analyze --fatal-infos && dart test
      - name: Browser extension
        working-directory: browser
        run: |
          dart analyze --fatal-infos && dart test
          tool/build.sh
      - name: Server image builds
        run: docker build -t sixora-server:ci .
      - name: Lockfiles unchanged
        run: git diff --exit-code -- '**/pubspec.lock'

  app:
    strategy:
      fail-fast: false
      matrix:
        target: [linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libx11-dev libxi-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - if: matrix.target == 'android'
        name: Ephemeral Android build identity
        run: tool/create_ci_android_keystore.sh
      - run: flutter pub get
      - name: Lockfile unchanged
        run: git diff --exit-code -- pubspec.lock
      # Once is enough: the result does not depend on the platform.
      - if: matrix.target == 'linux'
        run: flutter analyze --fatal-infos
      - if: matrix.target == 'linux'
        run: flutter test
      - if: matrix.target == 'linux'
        run: flutter build linux --release
      - if: matrix.target == 'android'
        run: flutter build apk --release --flavor prod --split-per-abi
      # Field detection of the autofill service (plain Kotlin tests).
      - if: matrix.target == 'android'
        working-directory: app/android
        run: ./gradlew :app:testProdDebugUnitTest --no-daemon -q

  macos-integration:
    name: macOS integration
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Server dependencies
        working-directory: server
        run: dart pub get
      - name: App dependencies
        working-directory: app
        run: flutter pub get
      - name: Isolated macOS integration test
        run: tool/integration_test.sh macos
