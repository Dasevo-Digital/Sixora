# Checks that every platform builds for a release tag and keeps the
# Windows, Linux and server packages as artifacts. It publishes nothing:
# releases and their files are created by hand from the local release
# folder (macOS and Android are built there, Android with the same key as
# every earlier APK).
name: Release build check

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-24.04
          # macOS and iOS in one job: the SDK, the packages and the pods
          # are set up once instead of twice.
          - target: apple
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - name: Version
        run: |
          echo "VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Windows
        if: matrix.target == 'windows'
        run: |
          flutter build windows --release
          cd build/windows/x64/runner/Release
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
            [ -f "$dll" ] || { echo "::error::$dll fehlt im Paket"; exit 1; }
          done
          7z a "$GITHUB_WORKSPACE/Sixora-$VERSION-windows-x64.zip" .
      - name: Linux
        if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          tar -czf "$GITHUB_WORKSPACE/Sixora-$VERSION-linux-x64.tar.gz" \
            -C build/linux/x64/release --transform 's,^bundle,Sixora,' bundle
      - name: macOS and iOS
        if: matrix.target == 'apple'
        run: |
          flutter build macos --release
          flutter build ios --release --no-codesign

      - if: matrix.target != 'apple'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sixora-${{ matrix.target }}
          path: Sixora-*.*

  server:
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle
        run: sh deploy/lxc/build_bundle.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sixora-server-${{ matrix.arch }}
          path: build/sixora-server-*.tar.gz
