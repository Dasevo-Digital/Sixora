# Checks only: analyze, test and build every platform. Publishes nothing;
# releases are created by hand from the local release folder.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  dart:
    name: Core and server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Core
        working-directory: packages/sixora_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Server image builds
        run: docker build -t sixora-server:ci .

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: linux
            runner: ubuntu-24.04
          - target: macos
            runner: macos-latest
          - target: ios
            runner: macos-latest
          - target: android
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get && flutter analyze --fatal-infos
      - if: matrix.target == 'windows'
        run: flutter build windows --release
      - if: matrix.target == 'linux'
        run: flutter build linux --release
      - if: matrix.target == 'macos'
        run: flutter build macos --release
      - if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
      - if: matrix.target == 'android'
        run: flutter build apk --release --flavor prod --split-per-abi
