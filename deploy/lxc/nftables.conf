#!/usr/sbin/nft -f
# Sixora behind Nginx Proxy Manager: only the proxy (and the container
# itself, for the health check) may reach port 8080. With
# SIXORA_TRUST_PROXY=true nobody else must be able to talk to the server
# directly. Adjust the proxy address, then:
#   install -m 0644 nftables.conf /etc/nftables.conf && systemctl enable --now nftables
flush ruleset

define proxy = 192.168.1.10

table inet sixora {
  chain input {
    type filter hook input priority 0; policy accept;
    tcp dport 8080 ip saddr { 127.0.0.1, $proxy } accept
    tcp dport 8080 ip6 saddr ::1 accept
    tcp dport 8080 drop
  }
}
