# Checks only: analyze, test and build on Linux runners. Publishes nothing;
# releases are created by hand from the local release folder.
#
# Every push stays on Linux, which is quick. Windows, macOS and iOS are
# built for a release tag or by hand (release-build.yml); macOS runners
# also count ten times and Windows twice whenever the repo is private.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the running check of the older one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  dart:
    name: Core and server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Core
        working-directory: packages/sixora_core
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Server image builds
        run: docker build -t sixora-server:ci .

  app:
    strategy:
      fail-fast: false
      matrix:
        target: [linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libayatana-appindicator3-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Once is enough: the result does not depend on the platform.
      - if: matrix.target == 'linux'
        run: flutter analyze --fatal-infos
      - if: matrix.target == 'linux'
        run: flutter build linux --release
      - if: matrix.target == 'android'
        run: flutter build apk --release --flavor prod --split-per-abi
